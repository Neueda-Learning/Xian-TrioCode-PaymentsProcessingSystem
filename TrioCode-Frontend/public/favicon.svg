<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="tc-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- Hexagon shell -->
  <polygon points="32,2 59,17 59,47 32,62 5,47 5,17"
           fill="url(#tc-bg)" stroke="url(#tc-accent)" stroke-width="2"/>

  <!-- Circuit traces -->
  <g stroke="#38bdf8" stroke-width="1.4" fill="none" opacity="0.55">
    <path d="M32 2 V14"/>
    <path d="M59 17 L47 24"/>
    <path d="M59 47 L47 40"/>
    <path d="M32 62 V50"/>
    <path d="M5 47 L17 40"/>
    <path d="M5 17 L17 24"/>
    <circle cx="47" cy="24" r="1.6" fill="#38bdf8"/>
    <circle cx="47" cy="40" r="1.6" fill="#38bdf8"/>
    <circle cx="17" cy="24" r="1.6" fill="#38bdf8"/>
    <circle cx="17" cy="40" r="1.6" fill="#38bdf8"/>
  </g>

  <!-- Stylised "T" / payment arrow monogram -->
  <path d="M20 24 H44 M32 24 V40" stroke="url(#tc-accent)" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M26 34 L32 40 L38 34" stroke="url(#tc-accent)" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
